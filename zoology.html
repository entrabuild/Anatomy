<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zoology — The Human Body · Interactive 3D Book</title>
<style>
  :root{--glass:rgba(16,22,18,.72);--line:rgba(255,255,255,.1);--txt:#f2f4ee;--mut:#a9b5a6;--acc:#ff8a7a;--gold:#e8c36a;--ease:cubic-bezier(.22,.8,.26,1)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#03050a;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased}
  canvas{display:block;outline:none;touch-action:none}
  .glass{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 36px rgba(0,0,0,.35)}
  #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:14px;color:var(--mut);background:#03050a;z-index:40;transition:opacity .6s}
  #loading .bar{width:180px;height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
  #loading .bar::after{content:"";display:block;height:100%;width:40%;background:var(--acc);animation:ld 1.1s ease-in-out infinite}
  @keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  #intro{position:fixed;left:50%;bottom:7vh;transform:translateX(-50%);text-align:center;transition:opacity .6s,transform .6s var(--ease);pointer-events:none}
  #intro h1{margin:0;font:700 30px Georgia,serif;letter-spacing:.5px;color:#f4ecd2;text-shadow:0 4px 24px rgba(0,0,0,.6)}
  #intro p{margin:8px 0 0;font-size:14px;color:var(--mut)}
  #intro .pill{display:inline-block;margin-top:14px;padding:8px 16px;border-radius:20px;border:1px solid rgba(232,195,106,.5);color:var(--gold);font-size:13px;font-weight:600;background:rgba(40,32,10,.4);animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 22px rgba(232,195,106,.35)}}
  body.open #intro{opacity:0;transform:translate(-50%,20px)}
  #top{position:fixed;top:12px;left:50%;transform:translate(-50%,-80px);display:flex;align-items:center;gap:6px;padding:6px;transition:transform .7s var(--ease);max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
  body.open #top{transform:translate(-50%,0)}
  .tab{font:inherit;font-size:12px;font-weight:600;color:var(--mut);background:transparent;border:1px solid transparent;padding:7px 11px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:all .15s}
  .tab:hover{color:#fff;background:rgba(255,255,255,.06)}
  .tab.on{color:#10140f;background:var(--acc);border-color:var(--acc)}
  .tab b{opacity:.6;margin-right:5px}
  .btn{font:inherit;font-size:12.5px;font-weight:600;color:var(--txt);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);padding:8px 12px;border-radius:10px;cursor:pointer;transition:background .15s,border-color .15s;white-space:nowrap}
  .btn:hover{background:rgba(255,255,255,.14)} .btn.on{background:rgba(143,224,122,.2);border-color:rgba(143,224,122,.6)}
  #nav{position:fixed;inset:auto 12px 12px auto;display:flex;gap:6px;opacity:0;pointer-events:none;transition:opacity .5s}
  body.open #nav{opacity:1;pointer-events:auto}
  #lab{position:fixed;left:50%;bottom:12px;transform:translate(-50%,140%);padding:10px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;max-width:min(980px,calc(100vw - 260px));transition:transform .7s var(--ease)}
  body.open #lab{transform:translate(-50%,0)}
  #lab .ttl{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--gold);font-weight:700;margin-right:4px}
  #lab .ctrl{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut)}
  #lab input[type=range]{width:110px;accent-color:var(--acc)}
  #lab .val{color:#fff;font-weight:600;min-width:34px;font-variant-numeric:tabular-nums}
  #lab .chip{font-size:12px;padding:6px 10px;border-radius:9px;background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--mut)}
  #lab .chip b{color:#fff;font-variant-numeric:tabular-nums}
  #lab .sep{width:1px;height:24px;background:var(--line)}
  #top,#lab,#nav,#hint,#intro,#libBtn{z-index:5}
  #libBtn{position:fixed;top:12px;left:12px;text-decoration:none;transition:opacity .4s}
  body.open #libBtn{opacity:.75}
  .frameWrap{overflow:hidden;opacity:0;pointer-events:none;transition:opacity .5s;background:#0a0d14;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
  .frameWrap.on{opacity:1;pointer-events:auto}
  .frameWrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#0a0d14}
  .frameLoad{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#cfd8e2;font-size:14px;background:#0a0d14;transition:opacity .5s;pointer-events:none}
  .frameLoad .bar{width:150px;height:3px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
  .frameLoad .bar::after{content:"";display:block;height:100%;width:40%;background:var(--acc);animation:ld 1.1s ease-in-out infinite}
  #fullView{position:fixed;inset:0;z-index:25;background:#05070c;opacity:0;pointer-events:none;transition:opacity .35s}
  #fullView.on{opacity:1;pointer-events:auto}
  #fullView iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  #fullView .fvBar{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:2;display:flex;align-items:center;gap:14px;padding:6px 6px 6px 16px;font-size:13px}
  body.fv #themeBtn{display:none}
  #tip{position:fixed;left:0;top:0;max-width:280px;padding:9px 12px;font-size:12.5px;line-height:1.45;color:#dfe7da;pointer-events:none;opacity:0;transition:opacity .15s;z-index:30}
  #tip b{display:block;color:#fff;font-size:13.5px;margin-bottom:2px}
  #hint{position:fixed;left:12px;bottom:12px;font-size:11.5px;color:var(--mut);padding:7px 11px;opacity:0;transition:opacity .5s}
  body.open #hint{opacity:1}
  @media (max-width:900px){#lab{max-width:calc(100vw - 24px);bottom:62px}#nav{right:50%;transform:translateX(50%)}#hint{display:none}}
/* ================= THEMES — 10 design styles; every panel, button and chip reads these variables ================= */
[data-theme]{--font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--hfont:Georgia,serif;--tt:none;--fw:600;--ls:0;
  --p-blur:blur(12px);--p-shine:none}
[data-theme=spatial]{--p-bg:rgba(44,52,66,.42);--p-bd:1px solid rgba(255,255,255,.22);--p-rad:26px;--p-sh:0 20px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25);--p-blur:blur(30px) saturate(160%);
  --t-txt:#fff;--t-mut:rgba(235,240,250,.72);--b-bg:rgba(255,255,255,.12);--b-bd:1px solid rgba(255,255,255,.16);--b-rad:999px;--b-sh:inset 0 1px 0 rgba(255,255,255,.18);--b-txt:#fff;
  --on-bg:#fff;--on-txt:#14181f;--on-soft:rgba(255,255,255,.32);--chip-bg:rgba(0,0,0,.22);--chip-bd:1px solid rgba(255,255,255,.12);--acc2:#9fd0ff;--h1:#fff;--hfont:Inter,system-ui,sans-serif;
  --p-shine:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,0) 40%)}
[data-theme=bento]{--p-bg:#151515;--p-bd:1px solid #2a2a2a;--p-rad:20px;--p-sh:0 14px 40px rgba(0,0,0,.5);--p-blur:none;
  --t-txt:#f3f3ee;--t-mut:#b9b9b0;--b-bg:#2b2b2b;--b-bd:1px solid transparent;--b-rad:14px;--b-sh:none;--b-txt:#f3f3ee;
  --on-bg:#e9ef8a;--on-txt:#161616;--on-soft:#3f7a5a;--chip-bg:#232323;--chip-bd:1px solid #333;--acc2:#e9ef8a;--h1:#f4f4ea;--hfont:Inter,system-ui,sans-serif}
[data-theme=liquid]{--p-bg:linear-gradient(135deg,rgba(110,90,255,.34),rgba(40,30,130,.46));--p-bd:1px solid rgba(200,190,255,.38);--p-rad:24px;--p-sh:0 16px 50px rgba(40,20,140,.45),inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 30px rgba(140,120,255,.18);--p-blur:blur(26px) saturate(170%);
  --t-txt:#fff;--t-mut:#cdc7ff;--b-bg:rgba(255,255,255,.1);--b-bd:1px solid rgba(210,200,255,.3);--b-rad:16px;--b-sh:inset 0 1px 0 rgba(255,255,255,.2);--b-txt:#fff;
  --on-bg:linear-gradient(135deg,#9a6cff,#4f8cff);--on-txt:#fff;--on-soft:rgba(154,108,255,.45);--chip-bg:rgba(20,10,80,.35);--chip-bd:1px solid rgba(200,190,255,.22);--acc2:#c7b8ff;--h1:#fff;--hfont:Inter,system-ui,sans-serif}
[data-theme=maximal]{--p-bg:#fffaf0;--p-bd:2px solid #ffd2a8;--p-rad:22px;--p-sh:0 10px 0 #ffb37a,0 18px 40px rgba(0,0,0,.3);--p-blur:none;
  --t-txt:#1d1b16;--t-mut:#5d5646;--b-bg:#fff;--b-bd:2px solid #1d1b16;--b-rad:999px;--b-sh:0 3px 0 #1d1b16;--b-txt:#1d1b16;
  --on-bg:#ff5a1f;--on-txt:#fff;--on-soft:#9be564;--chip-bg:#fff1c2;--chip-bd:2px solid #ffcf4a;--acc2:#e8460f;--h1:#fff3d6;--fw:800;--hfont:"Arial Black",Impact,sans-serif}
[data-theme=minimal]{--p-bg:#ecebe6;--p-bd:1px solid #d3d1ca;--p-rad:4px;--p-sh:none;--p-blur:none;
  --t-txt:#141414;--t-mut:#6b6a66;--b-bg:transparent;--b-bd:1px solid #141414;--b-rad:999px;--b-sh:none;--b-txt:#141414;
  --on-bg:#141414;--on-txt:#fff;--on-soft:#d6d4cc;--chip-bg:transparent;--chip-bd:1px solid #d3d1ca;--acc2:#ff5a1f;--h1:#f2f1ec;--fw:500;--hfont:Inter,system-ui,sans-serif}
[data-theme=brutal]{--p-bg:#f4f4f0;--p-bd:3px solid #000;--p-rad:0;--p-sh:6px 6px 0 #000;--p-blur:none;
  --t-txt:#000;--t-mut:#333;--b-bg:#fff;--b-bd:2px solid #000;--b-rad:0;--b-sh:3px 3px 0 #000;--b-txt:#000;
  --on-bg:#d4ff2a;--on-txt:#000;--on-soft:#b89bff;--chip-bg:#fff;--chip-bd:2px solid #000;--acc2:#7c4dff;--h1:#fff;--tt:uppercase;--fw:800;--ls:.4px;--font:"Arial Narrow",Arial,sans-serif;--hfont:Impact,"Arial Black",sans-serif}
[data-theme=clay]{--p-bg:#eef0ff;--p-bd:none;--p-rad:28px;--p-sh:0 14px 30px rgba(80,70,190,.35),inset -6px -6px 14px rgba(110,100,200,.18),inset 6px 6px 14px #fff;--p-blur:none;
  --t-txt:#3a3463;--t-mut:#6c66a0;--b-bg:#f7f8ff;--b-bd:none;--b-rad:18px;--b-sh:0 6px 12px rgba(90,80,200,.25),inset -3px -3px 6px rgba(110,100,200,.2),inset 3px 3px 6px #fff;--b-txt:#3a3463;
  --on-bg:#8c7cf6;--on-txt:#fff;--on-soft:#8bdc8b;--chip-bg:#fff;--chip-bd:none;--acc2:#7a6af0;--h1:#fff;--fw:800;--font:Nunito,"Trebuchet MS",system-ui,sans-serif;--hfont:Nunito,"Trebuchet MS",sans-serif}
[data-theme=glassy]{--p-bg:rgba(255,255,255,.58);--p-bd:1px solid rgba(255,255,255,.8);--p-rad:22px;--p-sh:0 12px 40px rgba(0,0,0,.25);--p-blur:blur(20px) saturate(140%);
  --t-txt:#1d2433;--t-mut:#5a6275;--b-bg:rgba(255,255,255,.65);--b-bd:1px solid rgba(255,255,255,.9);--b-rad:14px;--b-sh:0 2px 8px rgba(0,0,0,.08);--b-txt:#1d2433;
  --on-bg:#ff7a1a;--on-txt:#fff;--on-soft:#ffd2ad;--chip-bg:rgba(255,255,255,.55);--chip-bd:1px solid rgba(255,255,255,.8);--acc2:#ff7a1a;--h1:#fff;--hfont:Inter,system-ui,sans-serif}
[data-theme=neumo]{--p-bg:#e6e9ef;--p-bd:none;--p-rad:20px;--p-sh:8px 8px 18px rgba(0,0,0,.35),-4px -4px 12px rgba(255,255,255,.08);--p-blur:none;
  --t-txt:#39415a;--t-mut:#7a8199;--b-bg:#e6e9ef;--b-bd:none;--b-rad:12px;--b-sh:4px 4px 9px #c3c8d2,-4px -4px 9px #fff;--b-txt:#39415a;
  --on-bg:#e6e9ef;--on-txt:#3a6df0;--on-soft:#e6e9ef;--chip-bg:#e6e9ef;--chip-bd:none;--acc2:#3a6df0;--h1:#eef1f7;--hfont:Inter,system-ui,sans-serif}
[data-theme=skeuo]{--p-bg:linear-gradient(180deg,#fafafa,#dcdcdc);--p-bd:1px solid #b9b9b9;--p-rad:16px;--p-sh:0 1px 0 #fff inset,0 14px 34px rgba(0,0,0,.45);--p-blur:none;
  --t-txt:#2e2e2e;--t-mut:#6a6a6a;--b-bg:linear-gradient(180deg,#ffffff,#d9d9d9);--b-bd:1px solid #a9a9a9;--b-rad:10px;--b-sh:0 2px 0 #9a9a9a,0 3px 6px rgba(0,0,0,.25),inset 0 1px 0 #fff;--b-txt:#2e2e2e;
  --on-bg:linear-gradient(180deg,#d0d0d0,#ececec);--on-txt:#111;--on-soft:linear-gradient(180deg,#d0d0d0,#ececec);--chip-bg:#1d2a22;--chip-bd:1px solid #555;--acc2:#a0581a;--h1:#f2f2f2;--fw:700}

/* components wired to the variables */
html[data-theme],html[data-theme] body{font-family:var(--font)}
[data-theme] .glass{background:var(--p-shine),var(--p-bg);border:var(--p-bd);border-radius:var(--p-rad);box-shadow:var(--p-sh);backdrop-filter:var(--p-blur);-webkit-backdrop-filter:var(--p-blur);color:var(--t-txt)}
[data-theme] .btn{font-family:var(--font);font-weight:var(--fw);text-transform:var(--tt);letter-spacing:var(--ls);color:var(--b-txt);background:var(--b-bg);border:var(--b-bd);border-radius:var(--b-rad);box-shadow:var(--b-sh);transition:transform .12s,box-shadow .12s,background .15s,filter .15s}
[data-theme] .btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
[data-theme] .btn:active{transform:translateY(1px)}
[data-theme] .btn.on{background:var(--on-soft);color:var(--b-txt)}
[data-theme] .tab{font-family:var(--font);font-weight:var(--fw);text-transform:var(--tt);letter-spacing:var(--ls);color:var(--t-mut);border-radius:var(--b-rad)}
[data-theme] .tab:hover{color:var(--t-txt);background:var(--b-bg)}
[data-theme] .tab.on{background:var(--on-bg);color:var(--on-txt);border-color:transparent;box-shadow:var(--b-sh)}
[data-theme] #lab .chip{background:var(--chip-bg);border:var(--chip-bd);color:var(--t-mut);border-radius:calc(var(--b-rad) * .7)}
[data-theme] #lab .chip b,[data-theme] #lab .val{color:var(--t-txt)}
[data-theme] #lab .ttl{color:var(--acc2)} [data-theme] #lab .ctrl{color:var(--t-mut)}
[data-theme] #lab input[type=range]{accent-color:var(--acc2)}
[data-theme] #tip{color:var(--t-mut)} [data-theme] #tip b{color:var(--t-txt)} [data-theme] #hint{color:var(--t-mut)}
[data-theme] #intro h1,[data-theme] #head h1{font-family:var(--hfont);color:var(--h1);text-transform:var(--tt)}
/* style-specific touches */
[data-theme=bento] #lab .btn:nth-child(4n+1){background:#c9c3f5;color:#161616} [data-theme=bento] #lab .btn:nth-child(4n+2){background:#3d7a5a}
[data-theme=bento] #lab .btn:nth-child(4n+3){background:#f3c6e3;color:#161616} [data-theme=bento] #lab .btn:nth-child(4n){background:#e9ef8a;color:#161616}
[data-theme=bento] #lab .btn.on{outline:3px solid #fff;outline-offset:-3px}
[data-theme=maximal] #lab .btn:nth-child(4n+1){background:#ffd84a} [data-theme=maximal] #lab .btn:nth-child(4n+2){background:#9be564}
[data-theme=maximal] #lab .btn:nth-child(4n+3){background:#ffb3d9} [data-theme=maximal] #lab .btn:nth-child(4n){background:#a8c8ff}
[data-theme=maximal] #lab .btn.on{background:#ff5a1f;color:#fff}
[data-theme=neumo] .btn.on,[data-theme=neumo] .tab.on{box-shadow:inset 4px 4px 9px #c3c8d2,inset -4px -4px 9px #fff;color:#3a6df0}
[data-theme=skeuo] .btn.on,[data-theme=skeuo] .tab.on{box-shadow:inset 0 2px 5px rgba(0,0,0,.35),0 1px 0 #fff}
[data-theme=skeuo] .btn.on::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:#3cff5a;box-shadow:0 0 6px #3cff5a;vertical-align:1px}
[data-theme=skeuo] #lab .chip{font-family:"Courier New",monospace;color:#7dffa0} [data-theme=skeuo] #lab .chip b{color:#c8ffd6}
[data-theme=brutal] .glass{backdrop-filter:none}
[data-theme=liquid] .tab.on,[data-theme=liquid] .btn.on{box-shadow:0 0 18px rgba(140,110,255,.6)}

/* the style switcher */
#themeBtn{position:fixed;top:12px;right:12px;z-index:20}
#themePop{position:fixed;top:58px;right:12px;z-index:21;width:min(520px,calc(100vw - 24px));padding:14px;display:none}
#themePop.show{display:block}
#themePop h4{margin:0 0 10px;font:700 13px var(--font);color:var(--t-txt);text-transform:var(--tt)}
#themePop .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sw{cursor:pointer;border-radius:14px;padding:3px;border:2px solid transparent;background:none;font:inherit;text-align:left}
.sw.cur{border-color:var(--acc2)}
.sw .prev{height:78px;display:flex;flex-direction:column;justify-content:space-between;padding:9px;overflow:hidden;font-family:var(--font)}
.sw .prev .row{display:flex;gap:5px}
.sw .prev .btn{font-size:10px;padding:4px 8px}
.sw .prev .tab{font-size:10px;padding:4px 8px;border:0;cursor:pointer}
.sw .nm{display:block;margin:6px 4px 2px;font:600 12px Inter,system-ui,sans-serif;color:var(--t-txt)}
.sw[data-theme=spatial] .prev{background-image:linear-gradient(135deg,#2a3550,#5b6d8a)}
</style>
</head>
<body>
<div id="loading"><div>Opening Zoology…</div><div class="bar"></div></div>
<a id="libBtn" class="btn glass" href="index.html">⌂ Library</a>
<div id="intro"><h1>Zoology · The Human Body</h1><p>An interactive 3D book — read on the left, explore a live model on the right.</p><div class="pill">Click the book to open it</div></div>
<div id="top" class="glass"></div>
<div id="lab" class="glass"></div>
<div id="nav"><button class="btn" id="prev">← Prev</button><button class="btn" id="next">Next →</button><button class="btn" id="close">Close book</button></div>
<div id="hint" class="glass">Drag the experiment to turn it · Scroll to zoom · ← → turn pages</div>
<div id="tip" class="glass"></div>
<script type="importmap">

} }
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';
/* Spatial UI everywhere */
document.documentElement.dataset.theme = 'spatial';
const THEME = { get: () => 'spatial', set() { } };


/* ================= helpers ================= */
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const lerp = (a, b, t) => a + (b - a) * t, clamp = (x, a, b) => Math.max(a, Math.min(b, x)), clamp01 = x => clamp(x, 0, 1);
const ss = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const rand = Math.random;
let ENV = null;
const std = (hex, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: hex, roughness: 0.55 }, o));
const phys = (hex, o = {}) => new THREE.MeshPhysicalMaterial(Object.assign({ color: hex, roughness: 0.5, clearcoat: 0.12, clearcoatRoughness: 0.5, sheen: 0.35, sheenRoughness: 0.6 }, o));
const glassMat = (o = {}) => new THREE.MeshPhysicalMaterial(Object.assign({ color: '#dff4ff', roughness: 0.05, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.05, transparent: true, opacity: 0.16, depthWrite: false, side: THREE.DoubleSide, envMapIntensity: 1.5 }, o));
function tag(mesh, name, desc, list) { mesh.userData.info = { name, desc }; if (list) list.push(mesh); return mesh; }
function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; }

let readZoom = 1, zoomT = null;

/* ================= camera framing ================= */

/* ================= auto quality ================= */
const PERF = (() => {
  const dpr = Math.min(devicePixelRatio || 1, 2), L = [{ pr: Math.min(dpr, 0.75), rt: 0.55, every: 2 }, { pr: Math.min(dpr, 1), rt: 0.75, every: 1 }, { pr: Math.min(dpr, 1.25), rt: 1, every: 1 }, { pr: Math.min(dpr, 1.5), rt: 1, every: 1 }];

  const apply = () => { renderer.setPixelRatio(L[level].pr); renderer.setSize(innerWidth, innerHeight); const s = L[level].rt; if (s !== rtScale) { rtScale = s; for (const x of LAB) if (x && x.rt) x.rt.setSize(Math.round(RT_W * s), Math.round(RT_H * s)); } };

/* ================= loop ================= */
let last = performance.now(), time = 0, frameN = 0, uiT = 0, lastSig = 0;

function frame(now) {
